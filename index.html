<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YAPS</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  color-scheme:light;
  --page:#f2f4f7; --surface:#ffffff; --surface-2:#e9edf2; --surface-3:#dfe4ea;
  --ink:#161a1f; --ink-2:#5a6472; --muted:#8b95a1;
  --grid:#e4e8ed; --axis:#c3cad2; --hair:rgba(22,26,31,.12);
  --accent:#2a78d6; --accent-ink:#ffffff; --danger:#d03b3b;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7; --s8:#e34948;
  --shadow:0 1px 2px rgba(22,26,31,.06), 0 4px 16px rgba(22,26,31,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --page:#0f1215; --surface:#171b20; --surface-2:#20262d; --surface-3:#2a313a;
    --ink:#f1f3f5; --ink-2:#aab3bd; --muted:#7f8994;
    --grid:#252b32; --axis:#3a424b; --hair:rgba(255,255,255,.12);
    --accent:#3987e5; --accent-ink:#ffffff; --danger:#e66767;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --page:#0f1215; --surface:#171b20; --surface-2:#20262d; --surface-3:#2a313a;
  --ink:#f1f3f5; --ink-2:#aab3bd; --muted:#7f8994;
  --grid:#252b32; --axis:#3a424b; --hair:rgba(255,255,255,.12);
  --accent:#3987e5; --accent-ink:#ffffff; --danger:#e66767;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--page);color:var(--ink);font:14px/1.45 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
button,input,select{font:inherit;color:inherit}
.mono{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}

#app{display:grid;grid-template-rows:52px 1fr;height:100%}
header{display:flex;align-items:center;gap:16px;padding:0 16px;border-bottom:1px solid var(--hair);background:var(--surface)}
header h1{font-size:16px;font-weight:600;margin:0;letter-spacing:.01em}
header h1 small{font-weight:400;color:var(--ink-2);margin-left:8px}
.spacer{flex:1}
.field{display:flex;align-items:center;gap:8px;color:var(--ink-2)}
.field label{font-size:12px;text-transform:uppercase;letter-spacing:.06em}
input[type=number],input[type=text],select{background:var(--surface-2);border:1px solid transparent;border-radius:6px;padding:6px 8px;outline:none}
input:focus-visible,select:focus-visible,button:focus-visible{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
input[type=number]{width:72px;text-align:right}
.btn{background:var(--surface-2);border:1px solid transparent;border-radius:6px;padding:6px 12px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--surface-3)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.small{padding:3px 8px;font-size:12px}
.btn.icon{padding:4px 6px;line-height:1;color:var(--ink-2)}
.btn.icon:hover{color:var(--ink)}

main{display:grid;grid-template-columns:380px 1fr;min-height:0}
#sidebar{border-right:1px solid var(--hair);overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--page)}
#chartArea{display:grid;grid-template-rows:auto 1fr;min-height:0;padding:12px 16px 16px;gap:8px}
.toolbar{display:flex;align-items:center;gap:16px}
#legend{display:flex;flex-wrap:wrap;gap:6px 16px;min-height:20px}
.key{display:flex;align-items:center;gap:6px;cursor:pointer;color:var(--ink-2);user-select:none}
.key .sw{width:14px;height:3px;border-radius:2px;background:var(--c)}
.key.off{opacity:.45;text-decoration:line-through}
#chartWrap{position:relative;background:var(--surface);border-radius:10px;box-shadow:var(--shadow);min-height:0}
#chart{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:10px}
#tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--hair);box-shadow:var(--shadow);border-radius:8px;padding:8px 10px;font-size:12px;display:none;min-width:150px}
#tip .yr{font-weight:600;margin-bottom:4px}
#tip .row{display:flex;align-items:center;gap:8px;justify-content:space-between}
#tip .row .l{display:flex;align-items:center;gap:6px;color:var(--ink-2)}
#tip .dot{width:8px;height:8px;border-radius:50%;background:var(--c)}

.pop{background:var(--surface);border-radius:10px;box-shadow:var(--shadow);border-left:4px solid var(--c)}
.pop .head{display:flex;align-items:center;gap:6px;padding:8px 8px 8px 10px}
.pop .head .name{flex:1;min-width:0;background:transparent;border:1px solid transparent;border-radius:6px;padding:4px 6px;font-weight:600}
.pop .head .name:hover{background:var(--surface-2)}
.pop .head .name:focus{background:var(--surface-2)}
.pop .head .chev{transition:transform .15s}
.pop.open .head .chev{transform:rotate(90deg)}
.pop .sum{padding:0 14px 10px;color:var(--ink-2);font-size:12px}
.pop .sum b{color:var(--ink);font-weight:500}
.pop.hidden .sum,.pop.hidden .head .name{opacity:.5}
.pop .body{display:none;border-top:1px solid var(--hair);padding:12px 14px 14px;display:none;flex-direction:column;gap:14px}
.pop.open .body{display:flex}
.prop{display:flex;flex-direction:column;gap:6px}
.prop .lab{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.prop .lab .t{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2)}
.prop .lab .v{font-size:12px;color:var(--ink-2);text-align:right}
.prop .lab .v b{color:var(--ink);font-weight:500}
.seg{display:flex;background:var(--surface-2);border-radius:6px;padding:2px;gap:2px}
.seg button{flex:1;border:0;background:transparent;border-radius:4px;padding:5px 4px;cursor:pointer;color:var(--ink-2);font-size:12px}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.curve{width:100%;height:120px;display:block;touch-action:none;border-radius:6px;background:var(--surface);cursor:crosshair}
.presets{display:flex;gap:6px;flex-wrap:wrap}
.hint{font-size:12px;color:var(--muted);margin:-4px 0 0}
.popIn{width:100%;text-align:left}
.addRow{display:flex;gap:8px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--page);padding:8px 14px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.show{opacity:1}
@media (max-width:820px){
  body{overflow:auto}
  #app{height:auto}
  main{grid-template-columns:1fr}
  #sidebar{border-right:0;border-bottom:1px solid var(--hair);max-height:none;overflow:visible}
  #chartArea{height:70vh}
  header h1 small{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>YAPS <small>yet another population simulator</small></h1>
    <div class="spacer"></div>
    <div class="field"><label for="horizon">Years ahead</label><input id="horizon" class="mono" type="number" min="10" max="200" step="5" value="75"></div>
    <div class="field"><label for="metric">Show</label>
      <select id="metric">
        <option value="pop">Total population</option>
        <option value="births">Births per year</option>
        <option value="deaths">Deaths per year</option>
        <option value="median">Median age</option>
        <option value="over65">Share aged 65+</option>
        <option value="mvp">MVP ratio</option>
      </select>
    </div>
    <button class="btn" id="share">Copy share link</button>
    <button class="btn" id="reset">Load examples</button>
  </header>
  <main>
    <aside id="sidebar">
      <div id="pops"></div>
      <div class="addRow"><button class="btn primary" id="add">+ Add population</button></div>
      <p class="hint">Every change updates the chart straight away. Drag the points on the small graphs to shape how each value changes over time. Double-click a line to add a point, and drag a point off its graph to remove it.</p>
    </aside>
    <section id="chartArea">
      <div id="legend"></div>
      <div id="chartWrap"><canvas id="chart"></canvas><div id="tip"></div></div>
    </section>
  </main>
</div>
<div id="toast"></div>

<script>
(() => {
'use strict';

// ---------- constants ----------
const YEAR0 = new Date().getFullYear();
const AGES = 171;            // 0..170, last bin is 170+ (room for a life expectancy of 150)
const FEMALE_SHARE = 0.49;
const SERIES = 8;

const PROFILES = {
  young:    { label: 'Young',    r: 0.028 },
  balanced: { label: 'Balanced', r: 0.006 },
  older:    { label: 'Older',    r: -0.008 },
};

// Curve types: what the small editors edit. min/max are display bounds.
const CURVES = {
  fert: { title: 'Fertility', unit: 'children per woman', min: 0, max: 6, ref: 2.1, refLabel: 'replacement 2.1',
          fmt: v => v.toFixed(1),
          presets: [['Hold steady', 'hold'], ['Fall to 1.5', 'end', 1.5], ['Rise to 2.1', 'end', 2.1]] },
  life: { title: 'Life expectancy', unit: 'years', min: 40, max: 150, ref: null,
          fmt: v => v.toFixed(0),
          presets: [['Hold steady', 'hold'], ['+5 years', 'delta', 5], ['+10 years', 'delta', 10], ['Rise to 150', 'end', 150]] },
  mig:  { title: 'Net migration', unit: 'people a year', min: null, max: null, ref: 0, refLabel: '',
          fmt: v => (v > 0 ? '+' : v < 0 ? '−' : '') + fmtNum(Math.abs(v)),
          presets: [['Hold steady', 'hold'], ['Fall to zero', 'end', 0], ['Halve', 'scale', 0.5], ['Double', 'scale', 2]] },
};

// ---------- helpers ----------
function fmtNum(n) {
  const a = Math.abs(n), trim = s => s.replace(/\.?0+$/, '');
  if (a >= 1e9) return trim((n / 1e9).toFixed(a >= 1e10 ? 1 : 2)) + 'B';
  if (a >= 1e6) return trim((n / 1e6).toFixed(a >= 1e7 ? 1 : 2)) + 'M';
  if (a >= 1e3) return trim((n / 1e3).toFixed(a >= 1e4 ? 0 : 1)) + 'k';
  return Math.round(n).toString();
}
function parseNum(s) {
  s = String(s).trim().toLowerCase().replace(/,/g, '').replace(/\s+/g, '');
  const m = s.match(/^([+-]?\d*\.?\d+)\s*(k|m|b|bn|thousand|million|billion)?$/);
  if (!m) return NaN;
  const mult = { k: 1e3, thousand: 1e3, m: 1e6, million: 1e6, b: 1e9, bn: 1e9, billion: 1e9 }[m[2]] || 1;
  return parseFloat(m[1]) * mult;
}
function niceStep(range, target) {
  const raw = range / target, p = Math.pow(10, Math.floor(Math.log10(raw)));
  for (const f of [1, 2, 2.5, 5, 10]) if (f * p >= raw) return f * p;
  return 10 * p;
}
function niceCeil(v) { if (v <= 0) return 1; const p = Math.pow(10, Math.floor(Math.log10(v))); for (const f of [1, 2, 5, 10]) if (f * p >= v) return f * p; return 10 * p; }
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const seriesColor = slot => css('--s' + (slot + 1));
let uid = 1;
const newId = () => 'p' + (uid++) + '-' + Math.random().toString(36).slice(2, 6);

// Monotone cubic (Fritsch–Carlson) through points sorted by t in [0,1]
function interpolator(pts) {
  const n = pts.length, xs = pts.map(p => p.t), ys = pts.map(p => p.v);
  if (n === 1) return () => ys[0];
  const d = [], m = new Array(n);
  for (let i = 0; i < n - 1; i++) d[i] = (ys[i + 1] - ys[i]) / Math.max(1e-6, xs[i + 1] - xs[i]);
  m[0] = d[0]; m[n - 1] = d[n - 2];
  for (let i = 1; i < n - 1; i++) m[i] = d[i - 1] * d[i] <= 0 ? 0 : (d[i - 1] + d[i]) / 2;
  for (let i = 0; i < n - 1; i++) {
    if (d[i] === 0) { m[i] = 0; m[i + 1] = 0; continue; }
    const a = m[i] / d[i], b = m[i + 1] / d[i], s = a * a + b * b;
    if (s > 9) { const tau = 3 / Math.sqrt(s); m[i] = tau * a * d[i]; m[i + 1] = tau * b * d[i]; }
  }
  return x => {
    if (x <= xs[0]) return ys[0];
    if (x >= xs[n - 1]) return ys[n - 1];
    let i = 0; while (i < n - 2 && x > xs[i + 1]) i++;
    const h = xs[i + 1] - xs[i], t = (x - xs[i]) / h, t2 = t * t, t3 = t2 * t;
    return (2 * t3 - 3 * t2 + 1) * ys[i] + (t3 - 2 * t2 + t) * h * m[i] + (-2 * t3 + 3 * t2) * ys[i + 1] + (t3 - t2) * h * m[i + 1];
  };
}

// ---------- demography ----------
// Mortality: Gompertz curve with a Makeham constant and an infant/childhood bump,
// scaled so that life expectancy at birth equals e0. Cached per 0.1 year.
const mortCache = new Map();
function mortality(e0) {
  const key = Math.round(e0 * 10);
  if (mortCache.has(key)) return mortCache.get(key);
  const build = B => {
    const q = new Float64Array(AGES);
    for (let a = 0; a < AGES; a++) {
      const mu = 0.0003 + B * Math.exp(0.1 * a) + 250 * B * Math.exp(-a / 1.5);
      q[a] = 1 - Math.exp(-mu);
    }
    q[AGES - 1] = Math.max(q[AGES - 1], 0.5);
    return q;
  };
  const lifeExp = q => { let l = 1, e = 0; for (let a = 0; a < AGES; a++) { const nl = l * (1 - q[a]); e += (l + nl) / 2; l = nl; } return e + l * 1.5; };
  let lo = -28, hi = -2; // log B
  for (let i = 0; i < 40; i++) { const mid = (lo + hi) / 2; if (lifeExp(build(Math.exp(mid))) > e0) lo = mid; else hi = mid; }
  const q = build(Math.exp((lo + hi) / 2));
  mortCache.set(key, q);
  return q;
}
// Age pattern of childbearing (sums to 1 over ages 15..49)
const FERT_SHAPE = (() => { const f = new Float64Array(AGES); let s = 0; for (let a = 15; a <= 49; a++) { f[a] = Math.exp(-Math.pow((a - 28) / 7, 2)); s += f[a]; } for (let a = 0; a < AGES; a++) f[a] /= s; return f; })();
// Age pattern of migrants (sums to 1)
const MIG_SHAPE = (() => { const f = new Float64Array(AGES); let s = 0; for (let a = 0; a <= 80; a++) { f[a] = Math.exp(-Math.pow((a - 27) / 10, 2)) + 0.15 * Math.exp(-Math.pow((a - 8) / 6, 2)); s += f[a]; } for (let a = 0; a < AGES; a++) f[a] /= s; return f; })();

function stablePyramid(total, r, q) {
  const n = new Float64Array(AGES); let l = 1, s = 0;
  for (let a = 0; a < AGES; a++) { n[a] = Math.exp(-r * a) * l; s += n[a]; l *= (1 - q[a]); }
  for (let a = 0; a < AGES; a++) n[a] *= total / s;
  return n;
}

function simulate(p, horizon) {
  const fert = interpolator(p.fert), life = interpolator(p.life), mig = interpolator(p.mig);
  const out = { pop: [], births: [], deaths: [], median: [], over65: [], mvp: [] };
  let n = stablePyramid(p.pop, PROFILES[p.profile].r, mortality(life(0)));
  const record = (n, births, deaths) => {
    let tot = 0, old = 0, work = 0; for (let a = 0; a < AGES; a++) { tot += n[a]; if (a >= 65) old += n[a]; else if (a >= 17) work += n[a]; }
    let acc = 0, med = 0; for (let a = 0; a < AGES; a++) { if (acc + n[a] >= tot / 2) { med = a + (tot / 2 - acc) / Math.max(n[a], 1e-9); break; } acc += n[a]; }
    out.pop.push(tot); out.births.push(births); out.deaths.push(deaths); out.median.push(med); out.over65.push(tot > 0 ? old / tot : 0); out.mvp.push(work > 0 ? old / work : 0);
  };
  record(n, NaN, NaN);
  for (let y = 1; y <= horizon; y++) {
    const t = y / horizon, tfr = fert(t), q = mortality(life(t)), m = mig(t);
    let births = 0, deaths = 0;
    for (let a = 15; a <= 49; a++) births += n[a] * FEMALE_SHARE * tfr * FERT_SHAPE[a];
    const nn = new Float64Array(AGES);
    for (let a = 0; a < AGES; a++) { const d = n[a] * q[a]; deaths += d; const surv = n[a] - d; if (a < AGES - 1) nn[a + 1] += surv; else nn[a] += surv; }
    nn[0] += births * (1 - q[0] / 2);
    deaths += births * q[0] / 2;
    for (let a = 0; a < AGES; a++) nn[a] = Math.max(0, nn[a] + m * MIG_SHAPE[a]);
    n = nn;
    record(n, births, deaths);
  }
  return out;
}

// ---------- state ----------
const examples = () => ({
  horizon: 75, metric: 'pop',
  pops: [
    { id: newId(), name: 'United Kingdom', slot: 0, visible: true, open: true, pop: 68e6, profile: 'balanced',
      fert: [{ t: 0, v: 1.5 }, { t: 1, v: 1.5 }], life: [{ t: 0, v: 81 }, { t: 1, v: 86 }], mig: [{ t: 0, v: 300e3 }, { t: 1, v: 300e3 }] },
    { id: newId(), name: 'Japan', slot: 1, visible: true, open: false, pop: 124e6, profile: 'older',
      fert: [{ t: 0, v: 1.2 }, { t: 1, v: 1.2 }], life: [{ t: 0, v: 85 }, { t: 1, v: 89 }], mig: [{ t: 0, v: 150e3 }, { t: 1, v: 150e3 }] },
    { id: newId(), name: 'Nigeria', slot: 2, visible: true, open: false, pop: 230e6, profile: 'young',
      fert: [{ t: 0, v: 4.5 }, { t: 0.5, v: 3.2 }, { t: 1, v: 2.3 }], life: [{ t: 0, v: 55 }, { t: 1, v: 70 }], mig: [{ t: 0, v: -60e3 }, { t: 1, v: -60e3 }] },
  ],
});
let state = null;
const results = new Map();  // pop id -> simulate() output
const editors = new Map();  // pop id -> {fert,life,mig} CurveEditor

function load() {
  const h = location.hash.match(/^#s=(.+)$/);
  if (h) { try { state = JSON.parse(decodeURIComponent(escape(atob(h[1])))); history.replaceState(null, '', location.pathname); saveLocal(); return; } catch (e) { /* fall through */ } }
  try { const s = localStorage.getItem('yaps.v1'); if (s) { state = JSON.parse(s); return; } } catch (e) { /* ignore */ }
  state = examples();
}
let saveTimer = null;
function saveLocal() { clearTimeout(saveTimer); saveTimer = setTimeout(() => { try { localStorage.setItem('yaps.v1', JSON.stringify(state)); } catch (e) { /* ignore */ } }, 200); }
function shareUrl() { return location.origin + location.pathname + '#s=' + btoa(unescape(encodeURIComponent(JSON.stringify(state)))); }

function recompute(id) {
  const ids = id ? [id] : state.pops.map(p => p.id);
  for (const pid of ids) { const p = state.pops.find(x => x.id === pid); if (p) results.set(pid, simulate(p, state.horizon)); }
  for (const k of [...results.keys()]) if (!state.pops.find(p => p.id === k)) results.delete(k);
  drawChart(); renderSummaries(); saveLocal();
}

// ---------- curve editor ----------
class CurveEditor {
  constructor(pop, key, canvas, onChange) {
    this.pop = pop; this.key = key; this.spec = CURVES[key]; this.cv = canvas; this.onChange = onChange;
    this.ctx = canvas.getContext('2d');
    this.pad = { l: 44, r: 12, t: 10, b: 18 };
    this.drag = null; this.hover = -1;
    canvas.addEventListener('pointerdown', e => this.down(e));
    canvas.addEventListener('pointermove', e => this.move(e));
    canvas.addEventListener('pointerup', e => this.up(e));
    canvas.addEventListener('pointercancel', e => this.up(e));
    canvas.addEventListener('pointerleave', () => { if (!this.drag) { this.hover = -1; this.draw(); } });
    canvas.addEventListener('dblclick', e => this.add(e));
    new ResizeObserver(() => this.draw()).observe(canvas);
  }
  get pts() { return this.pop[this.key]; }
  bounds() {
    if (this.spec.min !== null) return [this.spec.min, this.spec.max];
    const m = niceCeil(Math.max(this.pop.pop * 0.02, ...this.pts.map(p => Math.abs(p.v) * 1.25), 1000));
    return [-m, m];
  }
  geom() {
    const r = this.cv.getBoundingClientRect();
    return { w: r.width, h: r.height, x0: this.pad.l, x1: r.width - this.pad.r, y0: this.pad.t, y1: r.height - this.pad.b };
  }
  toPx(t, v, g, b) { return [g.x0 + t * (g.x1 - g.x0), g.y1 - (v - b[0]) / (b[1] - b[0]) * (g.y1 - g.y0)]; }
  fromPx(x, y, g, b) { return [(x - g.x0) / (g.x1 - g.x0), b[0] + (g.y1 - y) / (g.y1 - g.y0) * (b[1] - b[0])]; }
  local(e) { const r = this.cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
  nearest(x, y) {
    const g = this.geom(), b = this.bounds(); let best = -1, bd = 14;
    this.pts.forEach((p, i) => { const [px, py] = this.toPx(p.t, p.v, g, b); const d = Math.hypot(px - x, py - y); if (d < bd) { bd = d; best = i; } });
    return best;
  }
  down(e) {
    const [x, y] = this.local(e); const i = this.nearest(x, y);
    if (i < 0) return;
    this.drag = { i, removed: false }; this.cv.setPointerCapture(e.pointerId); e.preventDefault();
  }
  move(e) {
    const [x, y] = this.local(e);
    if (!this.drag) { const h = this.nearest(x, y); if (h !== this.hover) { this.hover = h; this.draw(); } this.cv.style.cursor = h >= 0 ? 'grab' : 'crosshair'; return; }
    const g = this.geom(), b = this.bounds(), pts = this.pts, i = this.drag.i, p = pts[i];
    const interior = i > 0 && i < pts.length - 1;
    this.drag.removed = interior && (y < g.y0 - 30 || y > g.y1 + 30);
    let [t, v] = this.fromPx(x, y, g, b);
    v = clamp(v, b[0], b[1]);
    if (interior) t = clamp(t, pts[i - 1].t + 0.02, pts[i + 1].t - 0.02); else t = p.t;
    p.t = t; p.v = this.snap(v);
    this.draw(); this.onChange(true);
  }
  up(e) {
    if (!this.drag) return;
    if (this.drag.removed) this.pts.splice(this.drag.i, 1);
    this.drag = null; this.hover = -1; this.draw(); this.onChange(false);
  }
  add(e) {
    const [x, y] = this.local(e); if (this.nearest(x, y) >= 0) return;
    const g = this.geom(), b = this.bounds(); let [t, v] = this.fromPx(x, y, g, b);
    t = clamp(t, 0.02, 0.98); v = clamp(v, b[0], b[1]);
    const pts = this.pts; let i = pts.findIndex(p => p.t > t); if (i < 0) i = pts.length;
    if (t - pts[i - 1].t < 0.02 || pts[i].t - t < 0.02) return;
    pts.splice(i, 0, { t, v: this.snap(v) }); this.draw(); this.onChange(false);
  }
  snap(v) { if (this.key === 'fert') return Math.round(v * 20) / 20; if (this.key === 'life') return Math.round(v * 2) / 2; const s = niceStep(this.bounds()[1], 40); return Math.round(v / s) * s; }
  preset(kind, arg) {
    const pts = this.pts, start = pts[0].v; let end = pts[pts.length - 1].v;
    if (kind === 'hold') end = start; else if (kind === 'end') end = arg; else if (kind === 'delta') end = start + arg; else if (kind === 'scale') end = start * arg;
    const b = this.bounds();
    this.pop[this.key] = [{ t: 0, v: start }, { t: 1, v: clamp(end, b[0], b[1]) }];
    this.draw(); this.onChange(false);
  }
  draw() {
    const cv = this.cv, dpr = window.devicePixelRatio || 1, g = this.geom(); if (g.w === 0) return;
    if (cv.width !== Math.round(g.w * dpr) || cv.height !== Math.round(g.h * dpr)) { cv.width = Math.round(g.w * dpr); cv.height = Math.round(g.h * dpr); }
    const c = this.ctx; c.setTransform(dpr, 0, 0, dpr, 0, 0); c.clearRect(0, 0, g.w, g.h);
    const b = this.bounds(), col = seriesColor(this.pop.slot), pts = this.pts;
    c.font = '10px "IBM Plex Mono", ui-monospace, monospace'; c.textBaseline = 'middle';
    // grid + y labels (bottom, middle, top)
    c.strokeStyle = css('--grid'); c.lineWidth = 1; c.fillStyle = css('--muted'); c.textAlign = 'right';
    for (const f of [0, 0.5, 1]) { const y = Math.round(g.y1 - f * (g.y1 - g.y0)) + 0.5; c.beginPath(); c.moveTo(g.x0, y); c.lineTo(g.x1, y); c.stroke(); c.fillText(this.spec.fmt(b[0] + f * (b[1] - b[0])), g.x0 - 6, y); }
    // reference line
    if (this.spec.ref !== null && this.spec.ref > b[0] && this.spec.ref < b[1]) {
      const y = Math.round(this.toPx(0, this.spec.ref, g, b)[1]) + 0.5; c.strokeStyle = css('--axis'); c.beginPath(); c.moveTo(g.x0, y); c.lineTo(g.x1, y); c.stroke();
      if (this.spec.refLabel) { c.textAlign = 'right'; c.fillText(this.spec.refLabel, g.x1 - 2, y - 7); }
    }
    // x labels
    c.textAlign = 'left'; c.fillText(String(YEAR0), g.x0, g.y1 + 10); c.textAlign = 'right'; c.fillText(String(YEAR0 + state.horizon), g.x1, g.y1 + 10);
    // curve
    const f = interpolator(pts); c.strokeStyle = col; c.lineWidth = 2; c.lineJoin = 'round'; c.lineCap = 'round'; c.beginPath();
    const N = Math.max(40, Math.round(g.x1 - g.x0) >> 1);
    for (let i = 0; i <= N; i++) { const t = i / N, [x, y] = this.toPx(t, clamp(f(t), b[0], b[1]), g, b); i ? c.lineTo(x, y) : c.moveTo(x, y); }
    c.stroke();
    // points
    pts.forEach((p, i) => {
      const [x, y] = this.toPx(p.t, p.v, g, b); const removing = this.drag && this.drag.i === i && this.drag.removed;
      c.beginPath(); c.arc(x, y, 6, 0, Math.PI * 2); c.fillStyle = css('--surface'); c.fill();
      c.beginPath(); c.arc(x, y, 4.5, 0, Math.PI * 2); c.fillStyle = removing ? css('--danger') : col; c.fill();
      if (i === this.hover || (this.drag && this.drag.i === i)) {
        const label = removing ? 'remove' : this.spec.fmt(p.v) + ' in ' + Math.round(YEAR0 + p.t * state.horizon);
        c.font = '500 11px "IBM Plex Sans", system-ui, sans-serif'; c.textAlign = x > (g.x0 + g.x1) / 2 ? 'right' : 'left';
        const tx = x > (g.x0 + g.x1) / 2 ? x - 10 : x + 10, ty = y < g.y0 + 14 ? y + 14 : y - 12;
        const w = c.measureText(label).width; c.fillStyle = css('--surface'); c.fillRect(c.textAlign === 'right' ? tx - w - 4 : tx - 4, ty - 8, w + 8, 16);
        c.fillStyle = css('--ink'); c.fillText(label, tx, ty); c.font = '10px "IBM Plex Mono", ui-monospace, monospace';
      }
    });
  }
}

// ---------- sidebar ----------
const popsEl = document.getElementById('pops');
function curveSummary(pop, key) {
  const s = CURVES[key], pts = pop[key], a = pts[0].v, z = pts[pts.length - 1].v, end = YEAR0 + state.horizon;
  const ext = pts.reduce((m, p) => Math.abs(p.v - a) > Math.abs(m.v - a) ? p : m, pts[0]);
  const same = (x, y) => s.fmt(x) === s.fmt(y);
  if (same(a, z) && same(ext.v, a)) return `<b>${s.fmt(a)}</b> ${s.unit}, held steady`;
  if (!same(ext.v, z) && !same(ext.v, a)) return `<b>${s.fmt(a)}</b> now, ${ext.v > a ? 'peaking at' : 'dipping to'} ${s.fmt(ext.v)} around ${Math.round(YEAR0 + ext.t * state.horizon)}, then ${s.fmt(z)} by ${end}`;
  return `<b>${s.fmt(a)}</b> now, ${z > a ? 'rising' : 'falling'} to <b>${s.fmt(z)}</b> by ${end}`;
}
function renderSidebar() {
  popsEl.innerHTML = ''; editors.clear();
  for (const pop of state.pops) {
    const card = document.createElement('div');
    card.className = 'pop' + (pop.open ? ' open' : '') + (pop.visible ? '' : ' hidden');
    card.style.setProperty('--c', seriesColor(pop.slot));
    card.innerHTML = `
      <div class="head">
        <button class="btn icon chev" title="Expand">▸</button>
        <input class="name" value="${escapeHtml(pop.name)}" aria-label="Population name">
        <button class="btn icon eye" title="${pop.visible ? 'Hide on chart' : 'Show on chart'}">${pop.visible ? '●' : '○'}</button>
        <button class="btn icon del" title="Remove">✕</button>
      </div>
      <div class="sum" data-sum></div>
      <div class="body">
        <div class="prop">
          <div class="lab"><span class="t">Population today</span></div>
          <input class="mono popIn" type="text" value="${fmtNum(pop.pop)}" aria-label="Population today">
        </div>
        <div class="prop">
          <div class="lab"><span class="t">Age profile</span><span class="v">how many young vs old today</span></div>
          <div class="seg" data-seg>${Object.entries(PROFILES).map(([k, v]) => `<button data-k="${k}" class="${pop.profile === k ? 'on' : ''}">${v.label}</button>`).join('')}</div>
        </div>
        ${Object.keys(CURVES).map(k => `
        <div class="prop" data-curve="${k}">
          <div class="lab"><span class="t">${CURVES[k].title}</span><span class="v" data-cs></span></div>
          <canvas class="curve"></canvas>
          <div class="presets">${CURVES[k].presets.map((p, i) => `<button class="btn small" data-preset="${i}">${p[0]}</button>`).join('')}</div>
        </div>`).join('')}
      </div>`;
    const head = card.querySelector('.head');
    card.querySelector('.chev').onclick = () => { pop.open = !pop.open; card.classList.toggle('open', pop.open); saveLocal(); if (pop.open) editors.get(pop.id) && Object.values(editors.get(pop.id)).forEach(e => e.draw()); };
    head.querySelector('.name').addEventListener('input', e => { pop.name = e.target.value; renderLegend(); saveLocal(); });
    head.querySelector('.eye').onclick = () => { pop.visible = !pop.visible; renderSidebar(); renderLegend(); drawChart(); saveLocal(); };
    head.querySelector('.del').onclick = () => { if (state.pops.length > 1 && !confirm(`Remove ${pop.name}?`)) return; state.pops = state.pops.filter(p => p !== pop); renderSidebar(); renderLegend(); recompute(); };
    const popIn = card.querySelector('.popIn');
    popIn.addEventListener('change', () => { const v = parseNum(popIn.value); if (isFinite(v) && v > 0) { pop.pop = v; recompute(pop.id); Object.values(editors.get(pop.id)).forEach(e => e.draw()); } popIn.value = fmtNum(pop.pop); });
    card.querySelector('[data-seg]').onclick = e => { const b = e.target.closest('button'); if (!b) return; pop.profile = b.dataset.k; card.querySelectorAll('[data-seg] button').forEach(x => x.classList.toggle('on', x === b)); recompute(pop.id); };
    const eds = {};
    for (const k of Object.keys(CURVES)) {
      const wrap = card.querySelector(`[data-curve="${k}"]`), cs = wrap.querySelector('[data-cs]');
      const ed = new CurveEditor(pop, k, wrap.querySelector('canvas'), () => { cs.innerHTML = curveSummary(pop, k); recompute(pop.id); });
      cs.innerHTML = curveSummary(pop, k);
      wrap.querySelector('.presets').onclick = e => { const b = e.target.closest('button'); if (!b) return; const p = CURVES[k].presets[+b.dataset.preset]; ed.preset(p[1], p[2]); };
      eds[k] = ed;
    }
    editors.set(pop.id, eds);
    popsEl.appendChild(card);
  }
  renderSummaries();
  editors.forEach(eds => Object.values(eds).forEach(e => e.draw()));
}
function renderSummaries() {
  [...popsEl.children].forEach((card, i) => {
    const pop = state.pops[i], r = results.get(pop.id), el = card.querySelector('[data-sum]'); if (!r) return;
    const a = r.pop[0], z = r.pop[r.pop.length - 1], ch = (z - a) / a;
    el.innerHTML = `<b>${fmtNum(a)}</b> → <b>${fmtNum(z)}</b> by ${YEAR0 + state.horizon} (${ch >= 0 ? '+' : '−'}${Math.abs(ch * 100).toFixed(0)}%) · median age ${r.median[0].toFixed(0)} → ${r.median[r.median.length - 1].toFixed(0)}`;
    card.querySelectorAll('[data-curve]').forEach(w => { w.querySelector('[data-cs]').innerHTML = curveSummary(pop, w.dataset.curve); });
  });
}
function escapeHtml(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

document.getElementById('add').onclick = () => {
  const used = new Set(state.pops.map(p => p.slot)); let slot = 0; while (used.has(slot) && slot < SERIES) slot++; if (slot >= SERIES) slot = state.pops.length % SERIES;
  state.pops.forEach(p => p.open = false);
  state.pops.push({ id: newId(), name: 'New population', slot, visible: true, open: true, pop: 10e6, profile: 'balanced',
    fert: [{ t: 0, v: 2.0 }, { t: 1, v: 2.0 }], life: [{ t: 0, v: 75 }, { t: 1, v: 80 }], mig: [{ t: 0, v: 0 }, { t: 1, v: 0 }] });
  renderSidebar(); renderLegend(); recompute();
  const card = popsEl.lastElementChild; card.scrollIntoView({ block: 'nearest' }); card.querySelector('.name').select();
};

// ---------- legend ----------
const legendEl = document.getElementById('legend');
function renderLegend() {
  legendEl.innerHTML = '';
  for (const p of state.pops) {
    const k = document.createElement('div'); k.className = 'key' + (p.visible ? '' : ' off'); k.style.setProperty('--c', seriesColor(p.slot));
    k.innerHTML = `<span class="sw"></span><span>${escapeHtml(p.name || 'Unnamed')}</span>`;
    k.onclick = () => { p.visible = !p.visible; renderSidebar(); renderLegend(); drawChart(); saveLocal(); };
    legendEl.appendChild(k);
  }
}

// ---------- main chart ----------
const chart = document.getElementById('chart'), cctx = chart.getContext('2d'), tip = document.getElementById('tip'), wrap = document.getElementById('chartWrap');
const METRIC = {
  pop: { label: 'People', fmt: fmtNum },
  births: { label: 'Births per year', fmt: fmtNum },
  deaths: { label: 'Deaths per year', fmt: fmtNum },
  median: { label: 'Median age', fmt: v => v.toFixed(1) },
  over65: { label: 'Share aged 65+', fmt: v => (v * 100).toFixed(0) + '%' },
  mvp: { label: 'MVP ratio: people aged 65+ for every person aged 17 to 64', fmt: v => v.toFixed(2), ref: 1, refLabel: '1.00 = MVP threshold, one pensioner per working-age adult. Higher is worse.' },
};
let hoverX = null, chartGeom = null;
function drawChart() {
  const dpr = window.devicePixelRatio || 1, r = wrap.getBoundingClientRect(), W = r.width, H = r.height; if (!W || !H) return;
  if (chart.width !== Math.round(W * dpr) || chart.height !== Math.round(H * dpr)) { chart.width = Math.round(W * dpr); chart.height = Math.round(H * dpr); }
  const c = cctx; c.setTransform(dpr, 0, 0, dpr, 0, 0); c.clearRect(0, 0, W, H);
  const m = state.metric, mt = METRIC[m], pad = { l: 64, r: 24, t: 20, b: 34 }, x0 = pad.l, x1 = W - pad.r, y0 = pad.t, y1 = H - pad.b;
  const vis = state.pops.filter(p => p.visible && results.has(p.id));
  let max = 0; for (const p of vis) for (const v of results.get(p.id)[m]) if (isFinite(v) && v > max) max = v;
  if (max <= 0) max = 1;
  if (mt.ref) max = Math.max(max, mt.ref * 1.15);
  const step = niceStep(max, 5), ymax = Math.ceil(max / step) * step;
  const N = state.horizon, X = i => x0 + i / N * (x1 - x0), Y = v => y1 - v / ymax * (y1 - y0);
  chartGeom = { x0, x1, y0, y1, X, Y };
  c.font = '11px "IBM Plex Mono", ui-monospace, monospace'; c.textBaseline = 'middle'; c.fillStyle = css('--muted'); c.strokeStyle = css('--grid'); c.lineWidth = 1;
  for (let v = 0; v <= ymax + 1e-9; v += step) { const y = Math.round(Y(v)) + 0.5; c.beginPath(); c.moveTo(x0, y); c.lineTo(x1, y); c.stroke(); c.textAlign = 'right'; c.fillText(mt.fmt(v), x0 - 8, y); }
  c.strokeStyle = css('--axis'); c.beginPath(); c.moveTo(x0, Math.round(y1) + 0.5); c.lineTo(x1, Math.round(y1) + 0.5); c.stroke();
  if (mt.ref) { const y = Math.round(Y(mt.ref)) + 0.5; c.strokeStyle = css('--ink-2'); c.beginPath(); c.moveTo(x0, y); c.lineTo(x1, y); c.stroke(); c.textAlign = 'right'; c.font = '500 11px "IBM Plex Sans", system-ui, sans-serif'; c.fillStyle = css('--ink-2'); c.fillText(mt.refLabel, x1, y - 9); c.font = '11px "IBM Plex Mono", ui-monospace, monospace'; c.fillStyle = css('--muted'); }
  const xs = niceStep(N, 8); c.textAlign = 'center'; c.textBaseline = 'top';
  for (let i = 0; i <= N; i += xs) if (i === N || N - i >= xs / 2) c.fillText(String(YEAR0 + i), X(i), y1 + 8);
  if (N % xs) c.fillText(String(YEAR0 + N), X(N), y1 + 8);
  c.textAlign = 'left'; c.textBaseline = 'middle'; c.font = '500 11px "IBM Plex Sans", system-ui, sans-serif'; c.fillStyle = css('--ink-2'); c.fillText(mt.label, x0, y0 - 10);
  for (const p of vis) {
    const d = results.get(p.id)[m], col = seriesColor(p.slot); c.strokeStyle = col; c.lineWidth = 2; c.lineJoin = 'round'; c.lineCap = 'round'; c.beginPath(); let started = false;
    for (let i = 0; i <= N; i++) { if (!isFinite(d[i])) continue; const x = X(i), y = Y(d[i]); started ? c.lineTo(x, y) : c.moveTo(x, y); started = true; }
    c.stroke();
    const last = d[N]; if (isFinite(last)) { c.beginPath(); c.arc(X(N), Y(last), 6, 0, Math.PI * 2); c.fillStyle = css('--surface'); c.fill(); c.beginPath(); c.arc(X(N), Y(last), 4, 0, Math.PI * 2); c.fillStyle = col; c.fill(); }
  }
  if (hoverX !== null) {
    const i = clamp(Math.round((hoverX - x0) / (x1 - x0) * N), 0, N), x = Math.round(X(i)) + 0.5;
    c.strokeStyle = css('--axis'); c.beginPath(); c.moveTo(x, y0); c.lineTo(x, y1); c.stroke();
    const rows = vis.map(p => ({ p, v: results.get(p.id)[m][i] })).filter(r => isFinite(r.v)).sort((a, b) => b.v - a.v);
    for (const rr of rows) { c.beginPath(); c.arc(X(i), Y(rr.v), 5.5, 0, Math.PI * 2); c.fillStyle = css('--surface'); c.fill(); c.beginPath(); c.arc(X(i), Y(rr.v), 3.5, 0, Math.PI * 2); c.fillStyle = seriesColor(rr.p.slot); c.fill(); }
    tip.innerHTML = `<div class="yr">${YEAR0 + i}</div>` + rows.map(rr => `<div class="row"><span class="l"><span class="dot" style="--c:${seriesColor(rr.p.slot)}"></span>${escapeHtml(rr.p.name)}</span><span class="mono">${mt.fmt(rr.v)}</span></div>`).join('');
    tip.style.display = 'block';
    const tw = tip.offsetWidth; tip.style.left = (X(i) + 14 + tw > W ? X(i) - 14 - tw : X(i) + 14) + 'px'; tip.style.top = Math.max(8, Math.min(H - tip.offsetHeight - 8, y0 + 8)) + 'px';
  } else tip.style.display = 'none';
}
wrap.addEventListener('pointermove', e => { const r = wrap.getBoundingClientRect(); const x = e.clientX - r.left; hoverX = chartGeom && x >= chartGeom.x0 - 6 && x <= chartGeom.x1 + 6 ? x : null; drawChart(); });
wrap.addEventListener('pointerleave', () => { hoverX = null; drawChart(); });
new ResizeObserver(() => drawChart()).observe(wrap);

// ---------- header controls ----------
const horizonEl = document.getElementById('horizon'), metricEl = document.getElementById('metric');
horizonEl.addEventListener('change', () => { const v = clamp(Math.round(+horizonEl.value || 75), 10, 200); horizonEl.value = v; state.horizon = v; recompute(); editors.forEach(eds => Object.values(eds).forEach(e => e.draw())); });
metricEl.addEventListener('change', () => { state.metric = metricEl.value; drawChart(); saveLocal(); });
document.getElementById('share').onclick = async () => {
  const url = shareUrl();
  try { await navigator.clipboard.writeText(url); toast('Link copied. Anyone opening it sees exactly this set-up.'); }
  catch (e) { prompt('Copy this link:', url); }
};
document.getElementById('reset').onclick = () => { if (!confirm('Replace everything with the example populations?')) return; state = examples(); init(); toast('Examples loaded'); };
let toastTimer = null;
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2400); }

// redraw on theme change so canvas colors follow the tokens
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { renderSidebar(); renderLegend(); drawChart(); });
new MutationObserver(() => { renderSidebar(); renderLegend(); drawChart(); }).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

function init() {
  horizonEl.value = state.horizon; metricEl.value = state.metric;
  renderSidebar(); renderLegend(); recompute();
}
load();
document.fonts && document.fonts.ready.then(() => { drawChart(); editors.forEach(eds => Object.values(eds).forEach(e => e.draw())); });
init();
})();
</script>
</body>
</html>
